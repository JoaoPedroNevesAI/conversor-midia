<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Conversor de Mídia</title></head>
<body>
  <h1>Conversor de Mídia</h1>
  <form id="form">
    <input type="file" id="file" required>
    <input type="text" id="target" placeholder="formato de destino (ex: mp4)" required>
    <input type="email" id="email" placeholder="seu e-mail" required>
    <button type="submit">Converter</button>
  </form>
  <p id="status"></p>
  <script src="app.js"></script>
</body>
</html>
